name: Makefile CI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# on: workflow_dispatch

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release, obj | Out-Null
          make cleanall
          make
          make cleanobjects
          make debug=1

      - name: Package release
        shell: pwsh
        run: |
          $packageDir = "release/IdrAgra_${{ github.ref_name }}"
          $zipPath = "$packageDir.zip"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item release/*_release.exe $packageDir/
          Copy-Item release/*_debug.exe $packageDir/
          Copy-Item Utilities $packageDir/Utilities -Recurse
          Copy-Item demo $packageDir/demo -Recurse
          Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath -Force

      - name: Create GitHub release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')

          gh release create $env:GITHUB_REF_NAME `
            release/*_release.exe `
            release/*_debug.exe `
            release/*.zip `
            --title "IdrAgra $version" `
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
